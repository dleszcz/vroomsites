<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" width="340" height="76" fill="none">
  <!-- Automotive Emblem: Stylized Dynamic 'W' with aerodynamic racing splitters -->
  <g transform="translate(4, 8)">
    <!-- Base Dark Shield / Geometric Contour -->
    <rect x="0" y="2" width="56" height="56" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1.5" />
    
    <!-- Red Dynamic Accent / Aerodynamic Wing -->
    <path d="M6 14 L20 48 L27 48 L17 14 Z" fill="#DC2626" />
    
    <!-- Silver / White Dynamic Blades of 'W' -->
    <path d="M19 14 L28 48 L35 48 L44 14 L37 14 L31.5 37 L26 14 Z" fill="#FFFFFF" />
    <path d="M37 14 L44 14 L50 34 L43 34 Z" fill="#DC2626" />
    
    <!-- Bottom Aero Splitter Accent -->
    <rect x="12" y="52" width="32" height="2.5" rx="1.25" fill="#EF4444" />
  </g>

  <!-- Typography: WADERA -->
  <g transform="translate(76, 12)">
    <text x="0" y="36" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="34" 
          font-weight="900" 
          letter-spacing="0.04em" 
          fill="#FFFFFF">
      WADERA
    </text>

    <!-- Red Racing Dot Accent -->
    <circle cx="166" cy="30" r="3.5" fill="#DC2626" />

    <!-- Subtitle: AUTO HANDEL -->
    <text x="2" y="52" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="10.5" 
          font-weight="700" 
          letter-spacing="0.32em" 
          fill="#A1A1AA">
      AUTO HANDEL
    </text>

    <!-- Precision Horizontal Accent Lines -->
    <line x1="126" y1="48.5" x2="168" y2="48.5" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
